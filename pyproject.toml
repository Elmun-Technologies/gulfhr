[project]
name = "gulf-hr-bot"
version = "1.0.0"
description = "Gulf HR — amoCRM jarayon nazorati va sotuvchilar target boti"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# .env sozlamalari app import qilinishidan oldin o'rnatilishi shart
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
